<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#F3F4F6"/>
  
  <!-- Camera Icon -->
  <g transform="translate(150, 100)">
    <!-- Camera Body -->
    <rect x="0" y="20" width="100" height="60" rx="8" fill="#6B7280"/>
    
    <!-- Lens -->
    <circle cx="50" cy="50" r="25" fill="#374151"/>
    <circle cx="50" cy="50" r="18" fill="#1F2937"/>
    <circle cx="50" cy="50" r="12" fill="#111827"/>
    
    <!-- Viewfinder -->
    <rect x="20" y="5" width="20" height="15" rx="3" fill="#6B7280"/>
    
    <!-- Flash -->
    <circle cx="75" cy="12" r="4" fill="#EF4444"/>
    
    <!-- Lens Details -->
    <circle cx="50" cy="50" r="8" fill="#374151" stroke="#6B7280" stroke-width="1"/>
    <circle cx="50" cy="50" r="4" fill="#1F2937"/>
  </g>
  
  <!-- Text -->
  <text x="200" y="180" text-anchor="middle" fill="#6B7280" font-family="Arial, sans-serif" font-size="16" font-weight="500">
    No Image Available
  </text>
  
  <text x="200" y="200" text-anchor="middle" fill="#9CA3AF" font-family="Arial, sans-serif" font-size="12">
    Upload images in admin panel
  </text>
</svg>
